ecommerce_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ":memory:"

      # 1. DuckDB Extensions required for MinIO / S3 connectivity
      extensions:
        - httpfs
        - aws

      # 2. Configure MinIO S3 Filesystem & Credentials
      filesystems:
        - fs: s3
          key: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
          client_kwargs:
            endpoint_url: "http://minio:9000"
            region_name: "us-east-1"
            use_ssl: false
          config_kwargs:
            s3:
              addressing_style: "path"